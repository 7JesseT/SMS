<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Heart of Our Father School Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #faf9f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
          "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      }
      .loading {
        text-align: center;
        padding: 40px;
      }
      .loading h1 {
        color: #d4af37;
        margin-bottom: 10px;
        font-size: 24px;
      }
      .loading p {
        color: #666;
        margin-bottom: 20px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #d4af37;
        border-top: 4px solid transparent;
        border-radius: 50%;
        margin: 0 auto;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <h1>The Heart of Our Father School Manager</h1>
        <p>Loading application...</p>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
